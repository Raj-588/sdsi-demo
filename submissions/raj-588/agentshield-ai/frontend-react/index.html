<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentShield AI — IntentLock Gateway</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#070a12',
                            900: '#0c1222',
                            850: '#11182c',
                            800: '#172038',
                            700: '#1f2d4e',
                        },
                        cyber: {
                            blue: '#38bdf8',
                            emerald: '#10b981',
                            ruby: '#ef4444',
                            amber: '#f59e0b',
                            purple: '#a855f7',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- React 18 and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #070a12;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glow-emerald {
            box-shadow: 0 0 20px -5px rgba(16, 185, 129, 0.4);
        }
        .glow-ruby {
            box-shadow: 0 0 20px -5px rgba(239, 68, 68, 0.4);
        }
        .glow-blue {
            box-shadow: 0 0 20px -5px rgba(56, 189, 248, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.4);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0c1222;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2d4e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Base API prefix (relative for same origin)
        const API_BASE = window.location.port === "8000" ? "" : "http://localhost:8000";

        // Decision Badge Component
        function DecisionBadge({ decision }) {
            if (decision === 'ALLOW') {
                return (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        ALLOW
                    </span>
                );
            }
            if (decision === 'DENY') {
                return (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/30">
                        <span className="w-1.5 h-1.5 rounded-full bg-red-400"></span>
                        BLOCKED (DENY)
                    </span>
                );
            }
            if (decision === 'REQUIRES_APPROVAL') {
                return (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30">
                        <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                        REQUIRES APPROVAL
                    </span>
                );
            }
            return (
                <span className="inline-flex items-center px-2 py-0.5 rounded text-xs bg-slate-800 text-slate-300">
                    {decision}
                </span>
            );
        }

        // Main App Component
        function App() {
            const [currentTab, setCurrentTab] = useState('overview');
            const [metrics, setMetrics] = useState(null);
            const [llmStatus, setLlmStatus] = useState(null);
            const [auditEvents, setAuditEvents] = useState([]);
            const [approvals, setApprovals] = useState([]);
            const [loading, setLoading] = useState(true);
            const [refreshing, setRefreshing] = useState(false);
            const [notification, setNotification] = useState(null);

            // Fetch core data
            const loadData = async (silent = false) => {
                if (!silent) setRefreshing(true);
                try {
                    const [mRes, sRes, aRes, apRes] = await Promise.all([
                        fetch(`${API_BASE}/api/v1/dashboard/metrics`).then(r => r.json()).catch(() => null),
                        fetch(`${API_BASE}/api/v1/llm/status`).then(r => r.json()).catch(() => null),
                        fetch(`${API_BASE}/api/v1/audit?limit=250`).then(r => r.json()).catch(() => []),
                        fetch(`${API_BASE}/api/v1/approvals`).then(r => r.json()).catch(() => [])
                    ]);
                    if (mRes) setMetrics(mRes);
                    if (sRes) setLlmStatus(sRes);
                    if (aRes) setAuditEvents(aRes);
                    if (apRes) setApprovals(apRes);
                } catch (err) {
                    console.error("Error loading data:", err);
                } finally {
                    setLoading(false);
                    setRefreshing(false);
                }
            };

            useEffect(() => {
                loadData();
                const interval = setInterval(() => loadData(true), 10000);
                return () => clearInterval(interval);
            }, []);

            const showToast = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const seedData = async () => {
                setRefreshing(true);
                try {
                    const res = await fetch(`${API_BASE}/api/v1/demo/seed`, { method: 'POST' });
                    if (res.ok) {
                        showToast("🌱 Demo data successfully re-seeded!");
                        await loadData(false);
                    }
                } catch (e) {
                    showToast("Failed to seed data", "error");
                } finally {
                    setRefreshing(false);
                }
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Toast Notification */}
                    {notification && (
                        <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg shadow-xl border flex items-center gap-3 transition-all transform duration-300 ${
                            notification.type === 'success' 
                                ? 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200' 
                                : 'bg-red-950/90 border-red-500/40 text-red-200'
                        }`}>
                            <span>{notification.msg}</span>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className="w-64 bg-dark-900 border-r border-slate-800/80 flex flex-col justify-between p-4 flex-shrink-0">
                        <div>
                            {/* Logo */}
                            <div className="flex items-center gap-3 px-2 py-3 mb-6">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyber-blue to-cyber-purple flex items-center justify-center text-xl shadow-lg shadow-sky-500/20">
                                    🛡️
                                </div>
                                <div>
                                    <div className="font-extrabold text-slate-100 text-base tracking-tight leading-none">AgentShield AI</div>
                                    <div className="text-[11px] font-semibold text-sky-400 mt-1 uppercase tracking-wider">IntentLock 2.0</div>
                                </div>
                            </div>

                            {/* Status Card */}
                            <div className="bg-dark-850/80 border border-slate-800 rounded-xl p-3 mb-6">
                                <div className="flex items-center justify-between text-xs mb-2">
                                    <span className="text-slate-400 font-medium">Gateway Node</span>
                                    <span className="inline-flex items-center gap-1.5 text-emerald-400 font-semibold">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        ONLINE
                                    </span>
                                </div>
                                <div className="flex items-center justify-between text-xs text-slate-300 font-medium truncate mb-1">
                                    <span className="text-slate-400">Agent:</span>
                                    <span className="text-sky-400 font-bold bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/25">
                                        {llmStatus?.agent_name || llmStatus?.model || 'qwen2.5:3b'}
                                    </span>
                                </div>
                                <div className="text-[11px] text-slate-400 truncate mt-1">
                                    Model: <span className="text-slate-200 font-semibold">Qwen 2.5</span> · {llmStatus?.provider || 'ollama'}
                                </div>
                            </div>

                            {/* Navigation Items */}
                            <nav className="space-y-1">
                                {[
                                    { id: 'overview', label: 'Security Overview', icon: '📊' },
                                    { id: 'execution', label: 'Agent Execution', icon: '🤖' },
                                    { id: 'attack', label: 'Attack Simulation', icon: '⚔️' },
                                    { id: 'governance', label: 'Governance & Approvals', icon: '⚖️', badge: approvals.filter(a => !a.approved).length },
                                    { id: 'audit', label: 'Security Audit Log', icon: '📜' },
                                    { id: 'policy', label: 'Policy Inspector', icon: '🔍' },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setCurrentTab(tab.id)}
                                        className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 ${
                                            currentTab === tab.id 
                                                ? 'bg-sky-500/15 text-sky-300 border border-sky-500/30 shadow-sm shadow-sky-500/10' 
                                                : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                                        }`}
                                    >
                                        <div className="flex items-center gap-3">
                                            <span className="text-base">{tab.icon}</span>
                                            <span>{tab.label}</span>
                                        </div>
                                        {tab.badge > 0 && (
                                            <span className="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                {tab.badge}
                                            </span>
                                        )}
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* Bottom Actions */}
                        <div className="pt-4 border-t border-slate-800/80 space-y-2">
                            <div className="grid grid-cols-2 gap-2">
                                <button
                                    onClick={() => loadData(false)}
                                    disabled={refreshing}
                                    className="flex items-center justify-center gap-1.5 py-2 px-3 bg-dark-850 hover:bg-dark-800 border border-slate-700/80 rounded-lg text-xs font-medium text-slate-300 transition-colors"
                                >
                                    <span className={refreshing ? "animate-spin" : ""}>🔄</span>
                                    <span>Sync</span>
                                </button>
                                <button
                                    onClick={seedData}
                                    disabled={refreshing}
                                    className="flex items-center justify-center gap-1.5 py-2 px-3 bg-dark-850 hover:bg-emerald-950/40 border border-slate-700/80 hover:border-emerald-500/40 rounded-lg text-xs font-medium text-slate-300 hover:text-emerald-300 transition-colors"
                                >
                                    <span>🌱</span>
                                    <span>Seed</span>
                                </button>
                            </div>
                            <div className="flex justify-between items-center px-1 text-[11px] text-slate-500">
                                <span>Zero-Trust Gateway</span>
                                <a href={`${API_BASE}/docs`} target="_blank" className="text-sky-400 hover:underline">Swagger /docs</a>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden bg-dark-950">
                        {/* Topbar */}
                        <header className="h-14 border-b border-slate-800/80 bg-dark-900/60 backdrop-blur-md px-8 flex items-center justify-between flex-shrink-0">
                            <div className="flex items-center gap-4">
                                <h1 className="text-sm font-bold uppercase tracking-wider text-slate-300">
                                    {currentTab === 'overview' && '🛡️ Security Operations Center'}
                                    {currentTab === 'execution' && '🤖 Autonomous Agent Execution & Policy Interception'}
                                    {currentTab === 'attack' && '⚔️ Attack Simulation Benchmark'}
                                    {currentTab === 'governance' && '⚖️ Human-in-the-Loop Governance Queue'}
                                    {currentTab === 'audit' && '📜 Immutable Security Audit Trail'}
                                    {currentTab === 'policy' && '🔍 Task Scope & Policy Inspector'}
                                </h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-xs text-slate-400 flex items-center gap-2 bg-dark-850 border border-slate-800 px-3 py-1.5 rounded-lg">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                    Port 8000 Active
                                </span>
                            </div>
                        </header>

                        {/* Screen Content Body */}
                        <div className="flex-1 overflow-y-auto p-8">
                            {currentTab === 'overview' && (
                                <OverviewScreen metrics={metrics} auditEvents={auditEvents} onNavigate={setCurrentTab} />
                            )}
                            {currentTab === 'execution' && (
                                <ExecutionScreen onActionCompleted={() => loadData(true)} showToast={showToast} />
                            )}
                            {currentTab === 'attack' && (
                                <AttackScreen onActionCompleted={() => loadData(true)} showToast={showToast} />
                            )}
                            {currentTab === 'governance' && (
                                <GovernanceScreen 
                                    approvals={approvals} 
                                    onApproved={async (id) => {
                                        showToast(`Request ${id.slice(0, 8)} approved!`);
                                        await loadData(true);
                                    }} 
                                />
                            )}
                            {currentTab === 'audit' && (
                                <AuditScreen events={auditEvents} />
                            )}
                            {currentTab === 'policy' && (
                                <PolicyScreen />
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        // Consistent Stat Card Component
        function StatCard({ icon, title, value, subtitle, dotColor, glowClass }) {
            return (
                <div className="bg-dark-900 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-5 flex flex-col justify-between h-36 relative overflow-hidden transition-all duration-200 group">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <span className="text-base">{icon}</span>
                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{title}</span>
                        </div>
                        <span className={`w-2 h-2 rounded-full ${dotColor}`}></span>
                    </div>

                    <div className="my-auto py-1">
                        <div className="text-3xl font-extrabold text-white tracking-tight">{value}</div>
                    </div>

                    <div className="text-[11px] text-slate-400 truncate">
                        {subtitle}
                    </div>

                    <div className={`absolute top-0 right-0 w-24 h-24 rounded-full blur-2xl pointer-events-none opacity-20 ${glowClass}`}></div>
                </div>
            );
        }

        // Consistent Chart Card Component
        function ChartCard({ title, subtitle, badgeText, badgeColor, children }) {
            return (
                <div className="bg-dark-900 border border-slate-800/80 rounded-2xl p-6 flex flex-col h-[380px]">
                    <div className="flex items-center justify-between border-b border-slate-800/80 pb-3 mb-4 flex-shrink-0">
                        <div>
                            <div className="text-sm font-bold text-slate-200 tracking-wide">{title}</div>
                            <div className="text-xs text-slate-400 mt-0.5">{subtitle}</div>
                        </div>
                        {badgeText && (
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border ${badgeColor}`}>
                                {badgeText}
                            </span>
                        )}
                    </div>
                    <div className="flex-1 relative w-full h-full min-h-0">
                        {children}
                    </div>
                </div>
            );
        }

        // 1. Overview Screen
        function OverviewScreen({ metrics, auditEvents, onNavigate }) {
            const chartDonutRef = useRef(null);
            const chartBarRef = useRef(null);
            const [streamFilter, setStreamFilter] = useState('ALL');

            useEffect(() => {
                if (!metrics) return;

                // Doughnut Chart
                if (chartDonutRef.current) {
                    const ctx = chartDonutRef.current.getContext('2d');
                    if (window._donutChart) window._donutChart.destroy();
                    window._donutChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Allowed & Run', 'Blocked (Denied)', 'Requires Approval'],
                            datasets: [{
                                data: [metrics.allowed, metrics.denied, metrics.requires_approval],
                                backgroundColor: ['#10b981', '#ef4444', '#f59e0b'],
                                borderColor: '#0c1222',
                                borderWidth: 3,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 }, padding: 16 }
                                }
                            },
                            cutout: '70%'
                        }
                    });
                }

                // Bar Chart: Tool breakdown
                if (chartBarRef.current && auditEvents.length) {
                    const toolCounts = {};
                    auditEvents.forEach(e => {
                        toolCounts[e.tool] = (toolCounts[e.tool] || 0) + 1;
                    });
                    const labels = Object.keys(toolCounts);
                    const data = Object.values(toolCounts);

                    const ctx = chartBarRef.current.getContext('2d');
                    if (window._barChart) window._barChart.destroy();
                    window._barChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Invocations',
                                data: data,
                                backgroundColor: '#38bdf8',
                                borderRadius: 6,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                x: { ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 11 } }, grid: { display: false } },
                                y: { ticks: { color: '#64748b', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                            }
                        }
                    });
                }
            }, [metrics, auditEvents]);

            if (!metrics) {
                return <div className="text-slate-400">Loading telemetry metrics...</div>;
            }

            const blockedRate = metrics.total_proposed > 0 
                ? Math.round((metrics.denied / metrics.total_proposed) * 100) 
                : 0;

            const allRecentEvents = metrics.recent_events || [];
            const displayEvents = allRecentEvents.filter(e => {
                if (streamFilter === 'ALL') return true;
                return e.decision === streamFilter;
            });

            const approvalCount = allRecentEvents.filter(e => e.decision === 'REQUIRES_APPROVAL').length;
            const denyCount = allRecentEvents.filter(e => e.decision === 'DENY').length;
            const allowCount = allRecentEvents.filter(e => e.decision === 'ALLOW').length;

            return (
                <div className="space-y-6">
                    {/* Consistent 5-Block Metric Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <StatCard 
                            icon="⚡"
                            title="Proposed Calls"
                            value={metrics.total_proposed}
                            subtitle="Total agent tool requests"
                            dotColor="bg-sky-400"
                            glowClass="bg-sky-500"
                        />
                        <StatCard 
                            icon="✅"
                            title="Authorized & Run"
                            value={metrics.allowed}
                            subtitle={`${metrics.executed} executed in sandbox`}
                            dotColor="bg-emerald-400"
                            glowClass="bg-emerald-500"
                        />
                        <StatCard 
                            icon="🛑"
                            title="Blocked Attacks"
                            value={metrics.denied}
                            subtitle={`${blockedRate}% blocked before sandbox`}
                            dotColor="bg-red-400"
                            glowClass="bg-red-500"
                        />
                        <StatCard 
                            icon="🔒"
                            title="Requires Approval"
                            value={metrics.requires_approval}
                            subtitle="Sensitive actions dual-gated"
                            dotColor="bg-amber-400"
                            glowClass="bg-amber-500"
                        />
                        <StatCard 
                            icon="⏱️"
                            title="Gateway Latency"
                            value="< 0.05ms"
                            subtitle="Deterministic zero-delay check"
                            dotColor="bg-purple-400"
                            glowClass="bg-purple-500"
                        />
                    </div>

                    {/* Consistent 2-Block Visual Charts Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <ChartCard
                            title="Policy Decision Ratio"
                            subtitle="Breakdown of ALLOW vs DENY vs REQUIRES_APPROVAL"
                            badgeText="Authorization"
                            badgeColor="bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                        >
                            <canvas ref={chartDonutRef}></canvas>
                        </ChartCard>

                        <ChartCard
                            title="Intercepted Tool Requests"
                            subtitle="Targeted enterprise tools & frequency"
                            badgeText="Activity"
                            badgeColor="bg-sky-500/10 text-sky-400 border-sky-500/30"
                        >
                            <canvas ref={chartBarRef}></canvas>
                        </ChartCard>
                    </div>

                    {/* Consistent Recent Interceptions & Executions Stream */}
                    <div className="bg-dark-900 border border-slate-800/80 rounded-2xl p-6">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-800/80 pb-3 mb-4 gap-3">
                            <div>
                                <div className="text-sm font-bold text-slate-200 tracking-wide">Live Interceptions & Executions Stream</div>
                                <div className="text-xs text-slate-400 mt-0.5">Real-time gateway decisions, policy rationales, and enforcement outcomes</div>
                            </div>
                            
                            {/* Filter Chips */}
                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button
                                    onClick={() => setStreamFilter('ALL')}
                                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${
                                        streamFilter === 'ALL' 
                                            ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40 shadow-sm' 
                                            : 'bg-dark-950 text-slate-400 hover:text-slate-200 border border-slate-800'
                                    }`}
                                >
                                    All ({allRecentEvents.length})
                                </button>
                                <button
                                    onClick={() => setStreamFilter('REQUIRES_APPROVAL')}
                                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        streamFilter === 'REQUIRES_APPROVAL' 
                                            ? 'bg-amber-500/25 text-amber-300 border border-amber-500/50 shadow-sm' 
                                            : 'bg-dark-950 text-amber-400/80 hover:text-amber-300 border border-slate-800'
                                    }`}
                                >
                                    <span>🔒</span>
                                    <span>Requires Approval ({approvalCount})</span>
                                </button>
                                <button
                                    onClick={() => setStreamFilter('DENY')}
                                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        streamFilter === 'DENY' 
                                            ? 'bg-red-500/20 text-red-300 border border-red-500/40 shadow-sm' 
                                            : 'bg-dark-950 text-slate-400 hover:text-slate-200 border border-slate-800'
                                    }`}
                                >
                                    <span>🛑</span>
                                    <span>Blocked ({denyCount})</span>
                                </button>
                                <button
                                    onClick={() => setStreamFilter('ALLOW')}
                                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        streamFilter === 'ALLOW'

        // 5. Security Audit Screen
        function AuditScreen({ events }) {
            const [filter, setFilter] = useState('ALL');
            const [search, setSearch] = useState('');

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    if (filter !== 'ALL' && e.decision !== filter) return false;
                    if (search && !e.tool.toLowerCase().includes(search.toLowerCase()) && 
                        !(e.resource || '').toLowerCase().includes(search.toLowerCase()) &&
                        !e.explanation.toLowerCase().includes(search.toLowerCase())) {
                        return false;
                    }
                    return true;
                });
            }, [events, filter, search]);

            const downloadCSV = () => {
                const headers = ["Timestamp", "Correlation_ID", "Tool", "Operation", "Resource", "Decision", "Status", "Explanation"];
                const rows = filteredEvents.map(e => [
                    e.timestamp, e.correlation_id, e.tool, e.operation, e.resource || '', e.decision, e.execution_status, `"${e.explanation}"`
                ]);
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `agentshield_audit_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
            };

            return (
                <div className="space-y-6">
                    <div className="bg-dark-900 border border-slate-800/80 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3 w-full md:w-auto">

                                <option value="ALLOW">ALLOW Only</option>
                                <option value="DENY">DENY Only</option>
                                <option value="REQUIRES_APPROVAL">REQUIRES_APPROVAL Only</option>
                            </select>

                            <input
                                type="text"
                                placeholder="Search tool, resource, or rule..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                className="bg-dark-950 border border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-200 w-64"
                            />
                        </div>

                        <button
                            onClick={downloadCSV}
                            className="px-4 py-2 bg-dark-850 hover:bg-dark-800 border border-slate-700 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-2"
                        >
                            <span>📥</span>
                            <span>Export CSV</span>
                        </button>
                    </div>

                    <div className="bg-dark-900 border border-slate-800/80 rounded-2xl overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="text-slate-400 border-b border-slate-800 bg-dark-950/60 font-semibold">
                                    <tr>
                                        <th className="py-3 px-4">Timestamp</th>
                                        <th className="py-3 px-4">Correlation ID</th>
                                        <th className="py-3 px-4">Tool</th>
                                        <th className="py-3 px-4">Resource Target</th>
                                        <th className="py-3 px-4">Decision</th>
                                        <th className="py-3 px-4">Execution Status</th>
                                        <th className="py-3 px-4">Reason & Policy Rationale</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60 font-mono text-[11px]">
                                    {filteredEvents.map(e => (
                                        <tr key={e.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="py-3 px-4 text-slate-400 whitespace-nowrap">{e.timestamp?.replace('T', ' ').slice(0, 19)}</td>
                                            <td className="py-3 px-4 text-slate-500 font-mono text-[10px]">{e.correlation_id?.slice(0, 8)}...</td>
                                            <td className="py-3 px-4 font-bold text-sky-400">{e.tool}()</td>
                                            <td className="py-3 px-4 text-slate-300">{e.resource || '—'}</td>
                                            <td className="py-3 px-4"><DecisionBadge decision={e.decision} /></td>
                                            <td className="py-3 px-4 font-semibold text-slate-300">{e.execution_status}</td>
                                            <td className="py-3 px-4 font-sans text-slate-300 text-xs max-w-sm">{e.explanation}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // 6. Policy Inspector Screen
        function PolicyScreen() {
            const [selectedTemplate, setSelectedTemplate] = useState('summarize_q3_report');
            const [taskData, setTaskData] = useState(null);

            const inspect = async () => {
                const res = await fetch(`${API_BASE}/api/v1/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ template_id: selectedTemplate, original_request: '' })
                });
                const data = await res.json();
                setTaskData(data);
            };

            useEffect(() => {
                inspect();
            }, [selectedTemplate]);

            return (
                <div className="space-y-6">
                    <div className="bg-dark-900 border border-slate-800/80 rounded-2xl p-6">
                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                            Select Task Template to Inspect Trusted Scope
                        </label>
                        <select
                            value={selectedTemplate}
                            onChange={(e) => setSelectedTemplate(e.target.value)}
                            className="bg-dark-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 w-full md:w-80"
                        >
                            <option value="summarize_q3_report">summarize_q3_report</option>
                            <option value="summarize_q2_report">summarize_q2_report</option>
                            <option value="approved_customer_export">approved_customer_export</option>
                        </select>
                    </div>

                    {taskData && (
                        <div className="bg-dark-900 border border-slate-800/80 rounded-2xl p-6 space-y-6">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                                <div>
                                    <span className="font-mono text-xs text-slate-400">Task Scope: </span>
                                    <span className="font-mono text-sm font-bold text-sky-400">{taskData.id}</span>
                                </div>
                                <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                    {taskData.status}
                                </span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-dark-950 border border-slate-800 rounded-xl p-4">
                                    <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Allowed Tools</div>
                                    <div className="space-y-1 font-mono text-xs text-sky-300 font-bold">
                                        {taskData.permission?.allowed_tools?.map(t => <div key={t}>• {t}()</div>)}
                                    </div>
                                </div>

                                <div className="bg-dark-950 border border-slate-800 rounded-xl p-4">
                                    <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Allowed Operations</div>
                                    <div className="space-y-1 font-mono text-xs text-emerald-300 font-bold">
                                        {taskData.permission?.allowed_operations?.map(o => <div key={o}>• {o}</div>)}
                                    </div>
                                </div>

                                <div className="bg-dark-950 border border-slate-800 rounded-xl p-4">
                                    <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Allowed Resources</div>
                                    <div className="space-y-1 font-mono text-xs text-slate-200">
                                        {taskData.permission?.allowed_resources?.map(r => <div key={r}>• {r}</div>)}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-dark-950 border border-slate-800 rounded-xl p-4">
                                <div className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Dual-Custody Gating</div>
                                <div className="text-xs text-slate-300">
                                    Sensitive Pre-Approved: <b>{taskData.permission?.sensitive_approved ? 'YES (Authorized for Export)' : 'NO (Gated behind SecOps approval)'}</b>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
