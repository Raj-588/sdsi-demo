<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI chat (extension test page)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f7f6f3;--card:#fff;--line:#e4e1da;--text:#1f1e1c;--muted:#7a776f;--accent:#c96442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:600}
header .dot{width:22px;height:22px;border-radius:6px;background:var(--accent)}
header small{color:var(--muted);font-weight:400;margin-left:auto}
main{max-width:760px;margin:0 auto;padding:24px 16px 200px}
.msg{margin:14px 0;padding:12px 16px;border-radius:14px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.user{background:#ece9e2;margin-left:auto}
.file{background:var(--card);border:1px solid var(--line);font-size:13px}
.file b{display:block;margin-bottom:4px}
.empty{color:var(--muted);text-align:center;margin-top:80px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.ProseMirror{min-height:28px;outline:none}
.ProseMirror:empty:before{content:"How can I help you today?";color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.attach{cursor:pointer;color:var(--muted);font-size:13px;border:1px solid var(--line);border-radius:9px;padding:5px 10px}
.attach input{display:none}
#send{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:10px;width:34px;height:34px;font-size:17px;cursor:pointer}
</style></head>
<body>
<header><span class="dot"></span>AI Chat <small>test page standing in for claude.ai / gemini.google.com</small></header>
<main id="thread"><div class="empty" id="empty">Messages and files that actually reach the AI appear here.</div></main>
<div class="dock"><div class="box">
  <div class="ProseMirror" contenteditable="true" role="textbox" id="composer"></div>
  <div class="row"><label class="attach">📎 Attach file<input type="file" id="file"></label>
  <button aria-label="Send message" id="send">↑</button></div>
</div></div>
<script>
const c = document.getElementById("composer"), thread = document.getElementById("thread");
function add(cls, html){ document.getElementById("empty")?.remove(); const d=document.createElement("div"); d.className="msg "+cls; d.innerHTML=html; thread.appendChild(d); }
const esc = s => s.replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
// ?mode=gemini reproduces Gemini: Enter is handled on keyup, and the prompt goes out as a
// StreamGenerate request with an f.req body. Only messages whose request succeeded reach the "AI".
const GEMINI = new URLSearchParams(location.search).get("mode") === "gemini";
async function send(){
  const t=c.innerText.trim(); if(!t) return; c.innerText="";
  const body = "f.req=" + encodeURIComponent(JSON.stringify([null, JSON.stringify([[t, 0, null]])]));
  try {
    const r = await fetch("/extension-test/StreamGenerate", {method:"POST", headers:{"content-type":"application/x-www-form-urlencoded"}, body});
    if (r.ok) add("user", esc(t)); else add("file", "⚠️ Something went wrong (request rejected: HTTP " + r.status + ")");
  } catch (e) { add("file", "⚠️ Something went wrong (" + e + ")"); }
}
document.getElementById("send").addEventListener("click", send);
c.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!GEMINI) send(); } });
c.addEventListener("keyup", e => { if(GEMINI && e.key==="Enter" && !e.shiftKey) send(); });
document.getElementById("file").addEventListener("change", async e => {
  for (const f of e.target.files) {
    const preview = f.type === "application/pdf" ? "(binary PDF)" : esc((await f.text()).slice(0, 260)) + "…";
    add("file", `<b>📄 ${esc(f.name)}</b>${preview}`);
  }
});
</script></body></html>
